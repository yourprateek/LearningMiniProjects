<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header> <h1>Calculator</h1> </header>

    <main>
        <div class="calc"> 
            <div class="charger"> <hr> <hr> <hr> </div>
            <div class="input"><input type="number" id="inp"></div>
            <div class="keys">
                <div class="numbers">
                    <button class="number" style="border-top-left-radius: 10px;">7</button>
                    <button class="number" >8</button>
                    <button class="number" >9</button>
                    <button class="number" >4</button>
                    <button class="number" >5</button>
                    <button class="number" >6</button>
                    <button class="number" >1</button>
                    <button class="number" >2</button>
                    <button class="number" >3</button>
                    <button class="number" style="border-bottom-left-radius: 10px;">0</button>
                    <button class="number" >00</button>
                    <button class="number" >.</button>
                </div>
                <div class="operators">
                    <button class="operator highlighted_operator">
                        <svg viewBox="0 0 24 24" height="1em" fill="rgba(170, 0, 0, 0.607)" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M11.142 20C8.91458 20 7.80085 20 6.87114 19.4986C5.94144 18.9971 5.35117 18.0781 4.17061 16.24L3.48981 15.18C2.4966 13.6336 2 12.8604 2 12C2 11.1396 2.4966 10.3664 3.48981 8.82001L4.17061 7.76001C5.35117 5.92191 5.94144 5.00286 6.87114 4.50143C7.80085 4 8.91458 4 11.142 4L13.779 4C17.6544 4 19.5921 4 20.7961 5.17157C22 6.34315 22 8.22876 22 12C22 15.7712 22 17.6569 20.7961 18.8284C19.5921 20 17.6544 20 13.779 20H11.142Z" stroke="white" stroke-width="1.5"></path> <path d="M15.5 9.50002L10.5 14.5M10.5 9.5L15.5 14.5" stroke="white" stroke-width="1.5" stroke-linecap="round"></path> </g></svg>
                    </button>
                    <button class="operator highlighted_operator" style="color: white; border-top-right-radius: 10px;">C</button>
                    <button class="operator">
                        <svg viewBox="0 0 32 32" height="1em" xmlns="http://www.w3.org/2000/svg" fill="white"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <style type="text/css"> .linesandangles_een{fill:whitw;} </style> <path class="linesandangles_een" d="M17.414,16l4.95,4.95l-1.414,1.414L16,17.414l-4.95,4.95L9.636,20.95l4.95-4.95l-4.95-4.95 l1.414-1.414l4.95,4.95l4.95-4.95l1.414,1.414L17.414,16z"></path> </g></svg>
                    </button>
                    <button class="operator">
                        <svg viewBox="0 0 16 16" height="0.7em" fill="white" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M9.75 3.25C9.75 4.2165 8.9665 5 8 5C7.0335 5 6.25 4.2165 6.25 3.25C6.25 2.2835 7.0335 1.5 8 1.5C8.9665 1.5 9.75 2.2835 9.75 3.25Z" fill="white"></path> <path d="M1 9.5V6.5L15 6.5V9.5L1 9.5Z" fill="white"></path> <path d="M8 14.5C8.9665 14.5 9.75 13.7165 9.75 12.75C9.75 11.7835 8.9665 11 8 11C7.0335 11 6.25 11.7835 6.25 12.75C6.25 13.7165 7.0335 14.5 8 14.5Z" fill="white"></path> </g></svg>
                    </button>
                    <button class="operator">+</button>
                    <button class="operator">-</button>
                    <button class="operator" id="equal-btn" style="border-bottom-right-radius: 10px;">=</button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="index.js"></script>
</body>
</html>
